<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Valentine's Day ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff9ecb, #ff4da6);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 500px;
    text-align: center;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    padding: 25px;
    border-radius: 25px;
    box-shadow: 0 0 30px rgba(255,0,150,0.6);
}

h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 2.2rem;
    color: white;
    margin-bottom: 10px;
    text-shadow: 0 0 20px #ff1a75, 0 0 40px #ff66cc;
}

p {
    font-size: 1rem;
    color: white;
    font-weight: 600;
    margin-bottom: 25px;
    text-shadow: 0 0 10px #ff3399;
}

.polaroid-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
}

.polaroid {
    width: 120px;
    background: white;
    padding: 8px 8px 25px 8px;
    border-radius: 5px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    transform: rotate(-3deg);
    transition: transform 0.3s ease;
}

.polaroid:nth-child(even) {
    transform: rotate(3deg);
}

.polaroid img {
    width: 100%;
    height: 100px;
    object-fit: cover;
    border-radius: 3px;
}

.polaroid:hover {
    transform: scale(1.05) rotate(0deg);
}

.bouquet {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 25px;
}

.flower {
    font-size: 2.5rem;
    animation: float 3s ease-in-out infinite, glow 2s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 10px #ff00cc);
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-15px); }
    100% { transform: translateY(0px); }
}

@keyframes glow {
    0% { text-shadow: 0 0 10px #ff00cc, 0 0 20px #ff66ff; }
    100% { text-shadow: 0 0 25px #00ffff, 0 0 40px #ff00cc; }
}
</style>
</head>

<body>

<!-- Autoplay Music (Best possible compatibility) -->
<audio id="bgMusic" autoplay loop playsinline>
    <source src="your-music-file.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <h1>Happy Valentines Day 💖</h1>
    <p>Happy valentins day to the most beautiful girl, i love you so much</p>

    <div class="polaroid-container">
        <div class="polaroid"><img src="photo1.jpg"></div>
        <div class="polaroid"><img src="photo2.jpg"></div>
        <div class="polaroid"><img src="photo3.jpg"></div>
        <div class="polaroid"><img src="photo4.jpg"></div>
        <div class="polaroid"><img src="photo5.jpg"></div>
    </div>

    <div class="bouquet">
        <div class="flower">🌹</div>
        <div class="flower">🌻</div>
        <div class="flower">🌸</div>
        <div class="flower">🌷</div>
    </div>
</div>

<script>
// Force autoplay attempt for mobile browsers
window.addEventListener('load', function() {
    const music = document.getElementById('bgMusic');
    music.play().catch(() => {
        // If blocked, try again on first interaction
        document.addEventListener('touchstart', () => music.play(), { once: true });
        document.addEventListener('click', () => music.play(), { once: true });
    });
});
</script>

</body>
</html>
