<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Happy Valentine's Day ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff9ecb, #ff4da6);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.container {
    width: 100%;
    max-width: 420px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 0 25px rgba(255,0,150,0.6);
    text-align: center;
}

h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 1.9rem;
    color: white;
    margin-bottom: 10px;
    line-height: 1.2;
}

p {
    font-size: 0.95rem;
    color: white;
    font-weight: 600;
    margin-bottom: 20px;
}

.polaroid-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.polaroid {
    background: white;
    padding: 6px 6px 18px 6px;
    border-radius: 6px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.25);
    transform: rotate(-2deg);
}

.polaroid:nth-child(even) {
    transform: rotate(2deg);
}

.polaroid img {
    width: 100%;
    height: 110px;
    object-fit: cover;
    border-radius: 4px;
}

.bouquet {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 10px;
}

.flower {
    font-size: 2rem;
    animation: float 3s ease-in-out infinite, glow 2s ease-in-out infinite alternate;
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
}

@keyframes glow {
    0% { text-shadow: 0 0 8px #ff00cc; }
    100% { text-shadow: 0 0 18px #00ffff; }
}

@media (max-width: 350px) {
    .polaroid-container {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<audio id="bgMusic" autoplay loop playsinline>
    <source src="your-music-file.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <h1>Happy Valentines Day 💖</h1>
    <p>Happy valentins day to the most beautiful girl, i love you so much</p>

    <div class="polaroid-container">
        <div class="polaroid"><img src="photo1.jpg" alt="Memory 1"></div>
        <div class="polaroid"><img src="photo2.jpg" alt="Memory 2"></div>
        <div class="polaroid"><img src="photo3.jpg" alt="Memory 3"></div>
        <div class="polaroid"><img src="photo4.jpg" alt="Memory 4"></div>
        <div class="polaroid"><img src="photo5.jpg" alt="Memory 5"></div>
    </div>

    <div class="bouquet">
        <div class="flower">🌹</div>
        <div class="flower">🌻</div>
        <div class="flower">🌸</div>
        <div class="flower">🌷</div>
    </div>
</div>

<script>
window.addEventListener('load', function() {
    const music = document.getElementById('bgMusic');
    music.play().catch(() => {
        document.addEventListener('touchstart', () => music.play(), { once: true });
    });
});
</script>

</body>
</html>
